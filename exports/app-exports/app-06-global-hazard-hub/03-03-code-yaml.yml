version: "3.9"

services:
  mongo:
    image: mongo:6
    container_name: mongo
    environment:
      MONGO_INITDB_DATABASE: env_events
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  kafka:
    image: confluentinc/cp-kafka:7.5.2
    container_name: kafka
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.2
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  tf-serving:
    image: tensorflow/serving
    container_name: tf-serving
    command: >-
      --port=8500 --rest_api_port=8501
      --model_config_file=/config/models.config
    volumes:
      - ./tf-models:/models
      - ./tf-config/models.config:/config/models.config
    ports:
      - "8500:8500"
      - "8501:8501"

  api:
    build: ./server
    container_name: api
    environment:
      MONGO_URI: "mongodb://mongo:27017/env_events"
      TF_URL: "http://tf-serving:8501"
      NOTIFY_URL: "http://notify:5001/notify"
    depends_on:
      - mongo
      - tf-serving
    ports:
      - "3000:3000"

  notify:
    build: ./notify
    container_name: notify
    environment:
      FCM_SERVICE_ACCOUNT: /secrets/fcm.json
    volumes:
      - ./secrets/fcm.json:/secrets/fcm.json:ro
    ports:
      - "5001:5001"

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  mongo-data: