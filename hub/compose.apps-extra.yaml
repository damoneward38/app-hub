name: app-project-extra-previews
services:
  studio_01_untitled:
    image: nginxinc/nginx-unprivileged:alpine
    container_name: app-preview-47
    ports: ["127.0.0.1:19046:8080"]
    volumes:
      - "/Users/davidyoung/GitHub-Pull/AISTUDIO-APPS/01-untitled:/usr/share/nginx/html:ro"
      - "/Users/davidyoung/app-containers-hub/nginx-static.conf:/etc/nginx/conf.d/default.conf:ro"
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 5s
