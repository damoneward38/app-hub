services:
  skyguard:
    build:
      context: ./build-contexts/skyguard
      dockerfile: ../../containers/node-app.Dockerfile
    image: app-skyguard:local
    container_name: app-skyguard
    ports: ["127.0.0.1:19110:3000"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    profiles: ["backend"]
  buildmaster:
    build:
      context: ./build-contexts/buildmaster
      dockerfile: ../../containers/node-app.Dockerfile
    image: app-buildmaster:local
    container_name: app-buildmaster
    ports: ["127.0.0.1:19111:3000"]
    environment:
      - BUILDMASTER_TERMINAL_TOKEN=${BUILDMASTER_TERMINAL_TOKEN:-}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    profiles: ["backend"]
  magen-raki:
    build:
      context: ./build-contexts/magen-raki
      dockerfile: ../../containers/node-app.Dockerfile
    image: app-magen-raki:local
    container_name: app-magen-raki
    ports: ["127.0.0.1:19112:3000"]
    environment:
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - MAGEN_ADMIN_EMAIL=${MAGEN_ADMIN_EMAIL:-damoneward38@gmail.com}
      - MAGEN_ADMIN_PASSWORD_HASH=${MAGEN_ADMIN_PASSWORD_HASH:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    profiles: ["backend"]
