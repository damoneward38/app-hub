    volumes:
      - "/Users/davidyoung/GitHub-Pull/AISTUDIO-APPS/02-phone-in-logs:/usr/share/nginx/html:ro"
      - "/Users/davidyoung/app-containers-hub/nginx-static.conf:/etc/nginx/conf.d/default.conf:ro"
