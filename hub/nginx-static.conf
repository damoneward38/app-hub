server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    location ~ (^|/)\. { deny all; }
    location ~* \.(?:txt|md|py|sh|bash|yml|yaml|toml|lock|log|bak|env|sql|db)$ { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}