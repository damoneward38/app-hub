services:
  anosera:
    build:
      context: ./build-contexts/anosera
      dockerfile: ../../containers/vite-static.Dockerfile
    image: app-anosera:local
    container_name: app-anosera
    ports: ["127.0.0.1:19100:8080"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    profiles: ["runnable"]
  zehav:
